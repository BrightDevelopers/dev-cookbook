<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Download</title>
    <style>
      * {
        margin: 0;
        padding: 0;
      }
      body {
        font-family: monospace;
        background: #000;
        color: #0f0;
      }
      #progress {
        padding: 10px;
        font-size: 24px;
      }
      #status {
        padding: 10px;
        font-size: 14px;
        color: #888;
      }
      #fps {
        padding: 10px;
        font-size: 14px;
        color: #ff0;
      }
      #bar-track {
        margin: 10px;
        height: 20px;
        background: #222;
        border-radius: 4px;
        overflow: hidden;
      }
      #bar-fill {
        height: 100%;
        width: 0%;
        background: #0f0;
        transition: width 0.3s linear;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
      #spinner {
        display: inline-block;
        width: 18px;
        height: 18px;
        margin: 10px;
        border: 3px solid #333;
        border-top-color: #0f0;
        border-radius: 50%;
        animation: spin 1s linear infinite;
        vertical-align: middle;
      }
    </style>
  </head>
  <body>
    <div><span id="spinner"></span><span id="progress">0%</span></div>
    <div id="bar-track"><div id="bar-fill"></div></div>
    <div id="status">Initializing...</div>
    <div id="fps">FPS: --</div>
    <script>
      (async function () {
        "use strict";

        const AssetPool = require("@brightsign/assetpool");
        const AssetPoolFetcher = require("@brightsign/assetpoolfetcher");
        const AssetPoolFiles = require("@brightsign/assetpoolfiles");
        const NetworkStatus = require("@brightsign/networkstatus");

        // The only settings the app owns. No proxy settings here; the
        // player-wide proxy configured via roNetworkConfiguration.SetProxy()
        // or the DWS is applied automatically by the fetcher.
        const FILE_URL = ""; // REPLACE WITH A PUBLIC OR OTHERWISE REACHABLE FILE URL (https recommended)
        const ASSET_NAME = ""; // REPLACE WITH A FILENAME, e.g. "largevideo.mp4"
        const POOL_PATH = "SD:/pool";

        const progressDiv = document.getElementById("progress");
        const statusDiv = document.getElementById("status");
        const fpsDiv = document.getElementById("fps");
        const barFill = document.getElementById("bar-fill");
        const spinnerEl = document.getElementById("spinner");

        let totalBytes = 0;
        let downloadedBytes = 0;
        let finished = false;
        let errorMsg = null;

        function fmtSize(b) {
          if (b >= 1073741824) return (b / 1073741824).toFixed(2) + " GB";
          return (b / 1048576).toFixed(2) + " MB";
        }

        // FPS measurement state
        let frameCount = 0;
        let fpsLastTime = performance.now();
        let currentFps = 0;

        // Decoupled render loop. Runs at display frame rate. Demonstrates
        // that the main thread stays responsive while the fetcher streams
        // bytes to the pool.
        function render(now) {
          frameCount++;
          if (now - fpsLastTime >= 1000) {
            currentFps = frameCount;
            frameCount = 0;
            fpsLastTime = now;
          }
          fpsDiv.textContent = "FPS: " + currentFps;

          if (errorMsg !== null) {
            progressDiv.textContent = "ERROR";
            statusDiv.textContent = errorMsg;
            barFill.style.background = "#f00";
            spinnerEl.style.animationPlayState = "paused";
            return;
          }
          if (finished) {
            progressDiv.textContent = "100%";
            barFill.style.width = "100%";
            spinnerEl.style.display = "none";
            return;
          }
          const pct = totalBytes
            ? Math.floor((downloadedBytes / totalBytes) * 100)
            : 0;
          progressDiv.textContent = pct + "%";
          barFill.style.width = pct + "%";
          if (totalBytes) {
            statusDiv.textContent =
              fmtSize(downloadedBytes) + " / " + fmtSize(totalBytes);
          }
          requestAnimationFrame(render);
        }

        requestAnimationFrame(render);

        try {
          // Diagnostic only. The fetcher does not need this; the proxy is
          // applied automatically. Logged here so partners can see what the
          // OS is currently configured with.
          const host = await new NetworkStatus().getHostStatus();
          console.log(
            "OS proxy: " +
              (host.proxy || "(none)") +
              "  bypass: " +
              JSON.stringify(host.proxyBypass || [])
          );

          const pool = new AssetPool(POOL_PATH);
          const fetcher = new AssetPoolFetcher(pool);
          const assets = [{ name: ASSET_NAME, link: FILE_URL }];

          fetcher.addEventListener("progressevent", function (e) {
            totalBytes = e.currentFileTotal || 0;
            downloadedBytes = e.currentFileTransferred || 0;
          });

          fetcher.addEventListener("fileevent", function (e) {
            console.log(
              "fileevent: " +
                e.fileName +
                " response=" +
                e.responseCode +
                (e.error ? " error=" + e.error : "")
            );
            if (e.error) {
              errorMsg = "File " + e.fileName + ": " + e.error;
            }
          });

          // No "proxy" or "proxyBypassList" in the params, so the
          // player-wide proxy and bypass list apply. The fetcher aborts
          // and retries on stalled transfers via minimumTransferRate.
          await fetcher.start(assets, {
            progressInterval: 5,
            fileRetryCount: 5,
            minimumTransferRate: {
              bytesPerSecond: 1024,
              periodInSeconds: 60,
            },
          });

          const files = new AssetPoolFiles(pool, assets);
          const localPath = await files.getPath(ASSET_NAME);
          console.log("Download complete. Local path: " + localPath);
          finished = true;
        } catch (err) {
          errorMsg = (err && err.message) || JSON.stringify(err);
          console.error(err);
        }
      })();
    </script>
  </body>
</html>
